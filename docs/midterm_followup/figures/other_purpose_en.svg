<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900'>
<rect width='1600' height='900' fill='#F7F7F7'/>
<text x='80' y='70' font-family='Georgia, "Times New Roman", serif' font-size='38' font-weight='bold' fill='#222'>What falls under the "Other" purpose (7)</text>
<text x='80' y='112' font-family='Georgia, "Times New Roman", serif' font-size='24' fill='#555'>Any trip that is not commute, school, return home, shopping, tourism or hospital</text>
<rect x='80' y='156' width='700' height='56' fill='#1F4E9A'/>
<rect x='820' y='156' width='700' height='56' fill='#9AA3AF'/>
<text x='104' y='194' font-family='Georgia, "Times New Roman", serif' font-size='27' font-weight='bold' fill='#FFF'>Related to hot-place visits</text>
<text x='844' y='194' font-family='Georgia, "Times New Roman", serif' font-size='27' font-weight='bold' fill='#FFF'>Not related to hot-place visits</text>
<rect x='80' y='220' width='700' height='86' fill='#E6EDF7'/>
<rect x='820' y='220' width='700' height='86' fill='#ECEEF1'/>
<text x='104' y='273.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#1A2E55'>Eating out (restaurants, cafés)</text>
<text x='844' y='273.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#555'>Private academies (hagwon)</text>
<text x='104' y='359.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#1A2E55'>Meeting friends, drinks, nightlife</text>
<text x='844' y='359.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#555'>Field work, business trips, meetings</text>
<rect x='80' y='392' width='700' height='86' fill='#E6EDF7'/>
<rect x='820' y='392' width='700' height='86' fill='#ECEEF1'/>
<text x='104' y='445.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#1A2E55'>Movies, performances, exhibitions</text>
<text x='844' y='445.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#555'>Visiting family or friends at home</text>
<text x='104' y='531.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#1A2E55'>Sports and hobbies (gym, climbing, workshops)</text>
<text x='844' y='531.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#555'>Religious activities</text>
<rect x='80' y='564' width='700' height='86' fill='#E6EDF7'/>
<rect x='820' y='564' width='700' height='86' fill='#ECEEF1'/>
<text x='104' y='617.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#1A2E55'>Pop-up stores, events</text>
<text x='844' y='617.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#555'>Errands (bank, public office, hair salon)</text>
<text x='104' y='703.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#1A2E55'>Walks, parks, Han River</text>
<text x='844' y='703.0' font-family='Georgia, "Times New Roman", serif' font-size='27' fill='#555'>Trips made while working (delivery, transport)</text>
<text x='80' y='852' font-family='Georgia, "Times New Roman", serif' font-size='19' fill='#666'>Examples only, not the official category definition. In 2025, "Other" made up 98.7% of purpose 4+5+7 trips.</text>
</svg>